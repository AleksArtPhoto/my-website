<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Page - Aleks Art Photo</title>
  
  <!-- Шрифты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Платежная система Stripe SDK -->
  <script src="https://js.stripe.com/v3/"></script>
  
  <!-- Стили календаря Litepicker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css"/>
<script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
  
  <!-- Ваш файл стилей -->
  <link rel="stylesheet" href="bookstyle.css" />
</head>
<body class="nordic-body">

  <header class="main-header">
    <div class="header-wrap">
      <div class="logo-area">
        <img src="logo/logo1.png" width="50" height="50" alt="logo">
        <span class="brand-name">Aleks Art Photo</span>
      </div>
      <nav class="nav-links">
        <a href="home.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="services.html">Services</a>
        <a href="home.html#contact">Contacts</a>
      </nav>
    </div>
  </header>

  <div class="booking-card">
    <h1 class="card-title">Book a Photo Session</h1>

    <!-- БЛОК ВЫБОРА УСЛУГ -->
    <div class="services-grid">
      <div class="select-wrapper">
        <label for="individual-select">Services for Individuals</label>
        <select id="individual-select" class="form-select">
          <option value="" selected>-- Not selected --</option>
          <option value="mini" data-price="2500">Mini Session — 2 500 DKK</option>
          <option value="standard" data-price="4500">Standard Session — 4 500 DKK</option>
          <option value="signature" data-price="6500">Signature Session — 6 500 DKK</option>
          <option value="private" data-price="5500">Private Event — 5 500 DKK</option>
          <option value="wedding" data-price="12500">Wedding Essentials — 12 500 DKK</option>
          <option value="fullday" data-price="22000">Full Day Story — 22 000 DKK</option>
          <option value="reels" data-price="3500">Lifestyle Reels — 3 500 DKK</option>
          <option value="cinematic" data-price="6000">Cinematic Love Story — 6 000 DKK</option>
          <option value="family" data-price="8500">Family Documentary — 8 500 DKK</option>
          <option value="filmlook" data-price="3500">Digital Film Look — 3 500 DKK</option>
          <option value="proedit" data-price="1500">Pro Edit (Your Photos) — 1 500 DKK</option>
          <option value="fineart" data-price="450">Fine Art Retouch — 450 DKK</option>
          <option value="restoration" data-price="600">Photo Restoration — 600 DKK</option>
          <option value="workshop" data-price="2500">Camera Photo Workshop — 2 500 DKK</option>
          <option value="review" data-price="1200">Portfolio Review — 1 200 DKK</option>
        </select>
      </div>
      <div class="select-wrapper">
        <label for="business-select">Services for Business</label>
        <select id="business-select" class="form-select">
          <option value="" selected>-- Not selected --</option>
          <option value="ecom_mini" data-price="3000">E-commerce Pack Mini — 3 000 DKK</option>
          <option value="comm_signature" data-price="6500">Commercial Signature Session — 6 500 DKK</option>
          <option value="premium_exp" data-price="9500">Premium Experience — from 9 500 DKK</option>
          <option value="prod_basic" data-price="2800">Product Basic — 2 800 DKK</option>
          <option value="prod_brand" data-price="5500">Product Branding — 5 500 DKK</option>
          <option value="prod_camp" data-price="9500">Product Campaign — from 9 500 DKK</option>
          <option value="interior_ess" data-price="3500">Interior Essential — 3 500 DKK</option>
          <option value="interior_std" data-price="5500">Interior Standard — 5 500 DKK</option>
          <option value="interior_prem" data-price="8500">Interior Premium — from 8 500 DKK</option>
          <option value="social_clip" data-price="3500">Social Clip — 3 500 DKK</option>
          <option value="social_plus" data-price="5500">Social Plus — 5 500 DKK</option>
          <option value="brand_intro" data-price="7500">Brand Intro Video — 7 500 DKK</option>
          <option value="biz_promo" data-price="9500">Business Promo — 9 500 DKK</option>
          <option value="comm_pkg" data-price="15000">Commercial Package — from 15 000 DKK</option>
          <option value="property_vid" data-price="4500">Property Video — 4 500 DKK</option>
          <option value="logo_anim" data-price="1500">Logo Animation — from 1 500 DKK</option>
          <option value="motion_basic" data-price="1800">Motion Graphics Basic — 1 800 DKK</option>
          <option value="motion_ctx" data-price="2500">Context Motion Graphics — from 2 500 DKK</option>
          <option value="motion_upgrade" data-price="3500">Social Motion Upgrade — 3 500 DKK</option>
        </select>
      </div>
    </div>

    <!-- Подарочный сертификат -->
    <div class="gift-card-option">
      <input type="checkbox" id="gift-certificate">
      <label for="gift-certificate" class="checkbox-label">Buy as a Gift Certificate</label>
    </div>

    <!-- Календарь -->
    <div class="form-group">
      <label for="datepicker">Select a date *</label>
      <input type="text" id="datepicker" readonly placeholder="Click to choose a date..." class="form-input pointer" required />
      <div id="date-warning" class="text-error hidden">Please select a date first.</div>
    </div>

    <!-- Слоты времени -->
    <div class="form-group">
      <label>Select start time *</label>
      <div id="time-slots" class="slots-container"></div>
      <div id="selected-time-display" style="margin-top:10px; font-weight:600;"></div>
    </div>

    <!-- Форма контактов -->
    <form id="booking-form" class="contacts-form">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" class="form-input" required />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" class="form-input" required />
      </div>
      <div class="form-group">
        <label>Phone *</label>
        <input type="tel" name="phone" class="form-input" required />
      </div>
      <div class="form-group">
        <label>Location / Address of the Shoot *</label>
        <input type="text" name="location" class="form-input" required />
      </div>
      <div class="form-group">
        <label>Comment (optional, max 500 chars)</label>
        <textarea name="comment" maxlength="500" rows="3" class="form-input"></textarea>
      </div>
      
      <div class="price-display" id="live-price-display">Current Price: 0 DKK</div>
      
      <button type="button" id="pay-button" class="btn-nordic">
        Pay and Book
      </button>
    </form>
  </div>

  <!-- Модалка Stripe -->
<div id="payment-modal" class="modal-overlay hidden">
  
  <div class="modal-box" onclick="event.stopPropagation()">
    
    <button id="close-modal" class="modal-close-btn">&times;</button>
    
    <h2 class="modal-title">Confirm and Pay</h2>
    <p id="total-price" class="modal-price">Total: 0 DKK</p>

    <div id="payment-request-button" class="hidden"></div>

    <div class="nordic-divider">
      <span>or pay with card</span>
    </div>

    <form id="payment-form">
      <div id="card-element"></div>
      <div id="card-errors" class="text-error hidden" role="alert"></div>

      <button type="submit" id="submit-stripe" class="btn-nordic m-top-20">
        Pay Now
      </button>
    </form>

  </div>

</div>

  <script src="https://jsdelivr.net"></script>
  <script src="bookscript.js"></script>
</body>
</html>
