<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Page - Aleks Art Photo</title>
  
  <!-- Подключение шрифтов -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bookstyle.css"/>
  
  <!-- Платежная система Stripe SDK -->
  <script src="https://js.stripe.com/v3/"></script>
  
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- HEADER -->
<header class="bg-white shadow-md sticky top-0 z-[100]">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center relative">
    
    <!-- Лого и Название -->
    <div class="flex items-center gap-3">
      <!-- Убедитесь, что папка logo лежит в корне сайта -->
      <img src="logo1.png" width="40" height="40" alt="logo" class="object-contain">
      <div class="text-xl md:text-2xl font-bold">Aleks Art Photo</div>
    </div>

    <!-- Навигация для ПК (скрыта на мобильных) -->
    <nav class="hidden md:flex space-x-6">
      <a href="index.html" class="hover:text-blue-600 transition">Home</a>
      <a href="portfolio.html" class="hover:text-blue-600 transition">Portfolio</a>
      <a href="index.html#services" class="hover:text-blue-600 transition">Services</a>
      <a href="home.html#contact" class="hover:text-blue-600 transition">Contacts</a>
    </nav>

    <!-- Кнопка Бургер (видна только на мобильных) -->
    <button id="mobile-menu-btn" class="md:hidden block p-2 text-gray-800 focus:outline-none bg-gray-100 rounded-md" style="z-index: 110;">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
  </div>

  <!-- Выпадающее Мобильное Меню -->
  <div id="mobile-menu" class="hidden flex flex-col absolute top-full left-0 w-full bg-white shadow-xl border-t border-gray-100 p-6 space-y-4 md:hidden" style="z-index: 99;">
    <a href="index.html" class="text-lg font-bold py-2 border-b border-gray-50">Home</a>
    <a href="portfolio.html" class="text-lg font-bold py-2 border-b border-gray-50">Portfolio</a>
    <a href="index.html#services" class="text-lg font-bold py-2 border-b border-gray-50">Services</a>
    <a href="index.html#contact" class="text-lg font-bold py-2">Contact</a>
  </div>
</header>

  <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-sm border border-slate-100 mt-8 mb-12 main-card">
    <h1 class="text-3xl font-bold mb-8 text-center text-slate-900 tracking-tight">Book a Photo Session</h1>

    <!-- Контейнер переключателя B2C / B2B -->
    <div class="flex justify-center mb-12">
      <div id="toggle-container" class="relative bg-gray-200 p-1 rounded-full flex items-center w-72 h-12 shadow-inner cursor-pointer overflow-hidden">
        <div id="toggle-bg"
     class="absolute h-10 rounded-full shadow-md transition-all duration-300 ease-in-out"
     style="width: 138px; left: 4px; background: #d8e0e9;">
</div>
        <div id="text-b2c" class="relative z-10 flex-1 text-center text-sm font-bold transition-colors duration-300" style="color: #d8e0e9;">For Individuals</div>
        <div id="text-b2b" class="relative z-10 flex-1 text-center text-sm font-bold transition-colors duration-300" style="color: #6b7280;">For Business</div>
      </div>
    </div>

    <div class="mb-6">
      <label for="services-select" class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-2">Select Service *</label>
      <select id="services-select" name="service" required class="w-full border border-slate-200 p-3 rounded-md bg-white focus:border-slate-400 outline-none transition-colors select-input">
      </select>
    </div>

    <div class="mb-6 bg-slate-50 p-4 rounded-md border border-slate-100 flex items-center checkbox-card">
      <input type="checkbox" id="gift-certificate" name="gift_certificate" class="w-4 h-4 text-slate-700 border-slate-300 rounded focus:ring-slate-400 mr-3 cursor-pointer" />
      <label for="gift-certificate" class="font-semibold text-slate-700 cursor-pointer select-none">Buy as a Gift Certificate</label>
    </div>

    <div class="mb-6">
      <label for="datepicker" class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-2">Select a date *</label>
      <input type="text" id="datepicker" readonly placeholder="Click to open calendar..." class="border border-slate-200 rounded-md p-3 w-full bg-white cursor-pointer focus:border-slate-400 outline-none transition-colors" required />
      <div id="date-warning" class="text-rose-500 text-sm mt-1 hidden">Please select a date first.</div>
    </div>

    <div class="mb-8">
      <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-2">Select start time *</label>
      <div id="time-slots" class="grid-slots">
      </div>
    </div>

    <form id="booking-form" class="space-y-4 border-t border-slate-100 pt-6">
      <div class="form-group">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name *</label>
        <input type="text" name="name" required class="w-full border border-slate-200 p-3 rounded-md focus:border-slate-400 outline-none transition-colors" />
      </div>
      <div class="form-group">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-1">Email *</label>
        <input type="email" name="email" required class="w-full border border-slate-200 p-3 rounded-md focus:border-slate-400 outline-none transition-colors" />
      </div>
      <div class="form-group">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-1">Phone *</label>
        <input type="tel" name="phone" required class="w-full border border-slate-200 p-3 rounded-md focus:border-slate-400 outline-none transition-colors" />
      </div>
      <div class="form-group">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-1">Location / Address of the Shoot *</label>
        <input type="text" name="location" required class="w-full border border-slate-200 p-3 rounded-md focus:border-slate-400 outline-none transition-colors" />
      </div>
      <div class="form-group">
        <label class="block text-sm font-bold uppercase tracking-wider text-slate-600 mb-1">Comment (optional, max 500 chars)</label>
        <textarea name="comment" maxlength="500" rows="3" class="w-full border border-slate-200 p-3 rounded-md focus:border-slate-400 outline-none transition-colors"></textarea>
      </div>
      
      <div class="text-xl font-bold my-6 text-right text-slate-900 tracking-tight" id="live-price-display">Current Price: 0 DKK</div>
      
      <button type="button" id="pay-button" class="w-full btn-nordic py-4 rounded-md font-bold text-center tracking-wider uppercase cursor-pointer">
        Pay and Book
      </button>
    </form>
  </div>

  <div id="payment-modal" class="modal-hidden">
    <div class="modal-content bg-white rounded-lg p-6 relative shadow-xl border border-slate-100">
      <button id="close-modal" class="absolute top-3 right-3 text-3xl text-slate-400 hover:text-slate-800 transition-colors">&times;</button>
      <h2 class="text-xl font-bold mb-1 text-slate-900">Confirm and Pay</h2>
      <p id="total-price" class="mb-4 text-lg font-bold text-slate-700">Total: 0 DKK</p>
      
      <div id="payment-request-button" class="mb-2"></div>
      
      <div class="relative flex py-2 items-center my-4">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase tracking-wider">or pay with card</span>
          <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <form id="payment-form" class="space-y-4">
        <div id="card-element" class="p-3.5 border border-slate-200 rounded-md bg-slate-50"></div>
        <div id="card-errors" class="text-rose-500 text-sm hidden font-semibold" role="alert"></div>
        <button type="submit" id="submit-stripe" class="w-full btn-nordic py-3 rounded-md font-bold uppercase tracking-wider">
          Pay Now
        </button>
      </form>
    </div>
  </div>

  <!-- Подключаем только стабильный внешний скрипт календаря в самом конце -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css" />
  <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
  <script src="bookscript.js"></script>
</body>
</html>
