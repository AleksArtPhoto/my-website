<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AleksArtPhoto</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>

  <!-- HEADER -->
<header class="bg-white shadow-md sticky top-0" style="z-index: 9999;">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center relative">
    
    <!-- Лого -->
    <div class="flex items-center gap-3">
      <img src="logo1.png" width="40" height="40" alt="logo" class="object-contain">
      <div class="text-xl md:text-2xl font-bold">Aleks Art Photo</div>
    </div>

    <nav class="hidden md:flex space-x-6">
      <a href="index.html" class="hover:text-blue-600 transition">Home</a>
      <a href="index.html#services" class="hover:text-blue-600 transition">Services</a>
      <a href="book.html" class="hover:text-blue-600 transition">Book</a>
      <a href="index.html#contact" class="hover:text-blue-600 transition">Contact</a>
    </nav>

    <button id="mobile-menu-btn" class="md:hidden block p-2 text-gray-800 focus:outline-none bg-gray-100 rounded-md">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
  </div>

  <!-- МОБИЛЬНОЕ МЕНЮ: Добавлен фиксированный z-index -->
  <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-white shadow-2xl border-t border-gray-100 flex-col p-6 space-y-4 md:hidden" style="z-index: 10000; position: absolute;">
    <a href="index.html" class="text-lg font-bold py-2 border-b border-gray-50">Home</a>
    <a href="index.html#services" class="text-lg font-bold py-2 border-b border-gray-50">Services</a>
    <a href="book.html" class="text-lg font-bold py-2 border-b border-gray-50">Book</a>
    <a href="index.html#contact" class="text-lg font-bold py-2">Contact</a>
  </div>
</header>

  
<!-- Контейнер переключателя Портфолио -->
<div class="flex justify-center py-10 bg-gray-50 px-4">
  <!-- Ограничили макс. ширину до 350px, чтобы не растягивался на весь экран -->
  <div class="relative bg-gray-200 p-1 rounded-full flex items-center w-full max-w-[350px] h-12 shadow-inner cursor-pointer overflow-hidden">
    
    <!-- Плавающая подложка (теперь управляется через JS точнее) -->
    <div id="portfolio-toggle-bg" class="absolute h-10 rounded-full shadow-md transition-all duration-300 ease-in-out" 
         style="width: 110px; left: 4px; background: #e2e8f0; border: 1px solid #cbd5e1;"></div>
    
    <!-- Кнопки с ID для прямого клика -->
    <div id="btn-photo" class="relative z-10 flex-1 text-center text-[11px] font-bold transition-colors duration-300 uppercase cursor-pointer" style="color: #1e293b;">Photo</div>
    <div id="btn-retouch" class="relative z-10 flex-1 text-center text-[11px] font-bold transition-colors duration-300 uppercase cursor-pointer" style="color: #94a3b8;">Retouch</div>
    <div id="btn-video" class="relative z-10 flex-1 text-center text-[11px] font-bold transition-colors duration-300 uppercase cursor-pointer" style="color: #94a3b8;">Video</div>
  </div>
</div>

<!-- SECTION PORTFOLIO -->
<section class="py-10 bg-gray-50 min-h-[60vh]">
  <div class="container mx-auto px-4">
    
    <!-- Контейнеры (Photo / Retouch / Video) -->
    <div id="photo-portfolio" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
       <!-- Карточка с w-full h-full -->
       <div class="bg-white p-4 rounded-lg shadow-md group transform transition duration-300 hover:scale-105">
          <div class="relative rounded-lg overflow-hidden w-full h-full">
            <a href="portraits.html">
              <img src="test_photo.jpg" alt="Portrait" class="w-full h-full object-contain bg-gray-100">
              <div class="absolute inset-0 bg-black bg-opacity-20 group-hover:bg-opacity-40 transition"></div>
              <h3 class="absolute top-4 left-4 text-white text-xl font-bold">Portraits</h3>
            </a>
          </div>
       </div>
    </div>

    <div id="retouch-portfolio" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
       <!-- Сюда карточки ретуши -->
    </div>

    <div id="video-portfolio" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
       <!-- Сюда карточки видео -->
    </div>
  </div>
</section>

  

  <footer class="bg-white py-6 text-center text-sm text-gray-500">
    © 2025 AleksArtPhoto. All rights reserved.
  </footer>
  <script src="script.js"></script>
</body>
</html>
