<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Album</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
<script defer src="script_portraits.js"></script>
</head>

<!-- HEADER -->
<header class="bg-white shadow-md sticky top-0" style="z-index: 9999;">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center relative">
    
    <!-- Лого -->
    <div class="flex items-center gap-3">
      <img src="logo1.png" width="40" height="40" alt="logo" class="object-contain">
      <div class="text-xl md:text-2xl font-bold">Aleks Art Photo</div>
    </div>

    <nav class="hidden md:flex space-x-6">
      <a href="index.html" class="hover:text-blue-600 transition">Home</a>
      <a href="portfolio.html" class="hover:text-blue-600 transition">Portfolio</a>
      <a href="index.html#services" class="hover:text-blue-600 transition">Services</a>
      <a href="book.html" class="hover:text-blue-600 transition">Book</a>
      <a href="index.html#contact" class="hover:text-blue-600 transition">Contact</a>
      <a href="index.html#faq" class="hover:text-blue-600 transition">FAQ</a>
    </nav>

    <button id="mobile-menu-btn" class="md:hidden block p-2 text-gray-800 focus:outline-none bg-gray-100 rounded-md">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
  </div>

  <!-- МОБИЛЬНОЕ МЕНЮ: Добавлен фиксированный z-index -->
  <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-white shadow-2xl border-t border-gray-100 flex-col p-6 space-y-4 md:hidden" style="z-index: 10000; position: absolute;">
    <a href="portfolio.html" class="text-lg font-bold py-2 border-b border-gray-50">Portfolio</a>
    <a href="index.html" class="text-lg font-bold py-2 border-b border-gray-50">Home</a>
    <a href="index.html#services" class="text-lg font-bold py-2 border-b border-gray-50">Services</a>
    <a href="book.html" class="text-lg font-bold py-2 border-b border-gray-50">Book</a>
    <a href="index.html#contact" class="text-lg font-bold py-2 border-b border-gray-50">Contact</a>
    <a href="index.html#faq" class="text-lg font-bold py-2">FAQ</a>
  </div>
</header>


<!-- Фотоальбом -->
<main class="container mx-auto px-4 py-8">
   <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
      
      <div class="flex items-center justify-center bg-gray-50 rounded-lg shadow-sm overflow-hidden h-[450px]">
   <img src="team photography/1.jpg" alt="photo1" class="cursor-pointer album-img max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">
</div>
<div class="flex items-center justify-center bg-gray-50 rounded-lg shadow-sm overflow-hidden h-[450px]">
   <img src="team photography/2.jpg" alt="photo2" class="cursor-pointer album-img max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">
</div>
<div class="flex items-center justify-center bg-gray-50 rounded-lg shadow-sm overflow-hidden h-[450px]">
   <img src="team photography/3.jpg" alt="photo3" class="cursor-pointer album-img max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">
</div>
<div class="flex items-center justify-center bg-gray-50 rounded-lg shadow-sm overflow-hidden h-[450px]">
   <img src="team photography/4.jpg" alt="photo4" class="cursor-pointer album-img max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">
</div>
<div class="flex items-center justify-center bg-gray-50 rounded-lg shadow-sm overflow-hidden h-[450px]">
   <img src="team photography/5.jpg" alt="photo5" class="cursor-pointer album-img max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">
   </div>
   </div>
</main>

  <!-- Модальное окно (Должно быть здесь!) -->
  <div id="modal" class="fixed inset-0 hidden items-center justify-center z-[9999] bg-black bg-opacity-95 modal-overlay">
    <!-- Кнопки управления -->
    <button id="closeBtn" class="absolute top-6 right-8 text-white text-5xl font-light hover:text-gray-300 transition z-[10001]">&times;</button>
    <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-6xl font-light hover:text-gray-400 transition z-[10001]">❮</button>
    <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-6xl font-light hover:text-gray-400 transition z-[10001]">❯</button>

    <!-- Контейнер для фото -->
    <div class="flex items-center justify-center w-full h-full p-4">
      <img id="modalImg" src="" alt="Full View" class="max-w-full max-h-full object-contain shadow-2xl">
    </div>
  </div>

  <script src="script_portraits.js"></script>
</body>
</html>
