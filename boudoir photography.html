<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Album</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
<script defer src="script_portraits.js"></script>
</head>

<!-- HEADER -->
<header class="bg-white shadow-md sticky top-0" style="z-index: 9999;">
<div class="container mx-auto px-4 py-4 flex justify-between items-center relative">
<!-- Лого -->
   <div class="flex items-center gap-3">
      <img src="logo1.png" width="40" height="40" alt="logo" class="object-contain">
      <div class="text-xl md:text-2xl font-bold">Aleks Art Photo</div>
   </div>

   <nav class="hidden md:flex space-x-6">
      <a href="index.html" class="hover:text-blue-600 transition">Home</a>
      <a href="index.html#services" class="hover:text-blue-600 transition">Services</a>
      <a href="book.html" class="hover:text-blue-600 transition">Book</a>
      <a href="index.html#contact" class="hover:text-blue-600 transition">Contact</a>
   </nav>

   <button id="mobile-menu-btn" class="md:hidden block p-2 text-gray-800 focus:outline-none bg-gray-100 rounded-md">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
   </button>
</div>

<!-- МОБИЛЬНОЕ МЕНЮ: Добавлен фиксированный z-index -->
<div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-white shadow-2xl border-t border-gray-100 flex-col p-6 space-y-4 md:hidden" style="z-index: 10000; position: absolute;">
   <a href="index.html" class="text-lg font-bold py-2 border-b border-gray-50">Home</a>
   <a href="index.html#services" class="text-lg font-bold py-2 border-b border-gray-50">Services</a>
   <a href="book.html" class="text-lg font-bold py-2 border-b border-gray-50">Book</a>
   <a href="index.html#contact" class="text-lg font-bold py-2">Contact</a>
</div>
</header>


<!-- Фотоальбом -->
<main class="container mx-auto px-4 py-8">
   <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <!-- Сгенерированные 24 изображения -->
      <img src="boudoir photography/1.jpg" alt="photo1" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/2.jpg" alt="photo2" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/3.jpg" alt="photo3" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/4.jpg" alt="photo4" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/5.jpg" alt="photo5" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/6.jpg" alt="photo6" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/7.jpg" alt="photo7" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/8.jpg" alt="photo8" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/9.jpg" alt="photo9" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/10.jpg" alt="photo10" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/11.jpg" alt="photo11" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/12.jpg" alt="photo12" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/13.jpg" alt="photo13" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/14.jpg" alt="photo14" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/15.jpg" alt="photo15" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/16.jpg" alt="photo16" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/17.jpg" alt="photo17" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/18.jpg" alt="photo18" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/19.jpg" alt="photo19" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/20.jpg" alt="photo20" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/21.jpg" alt="photo21" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/22.jpg" alt="photo22" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/23.jpg" alt="photo23" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
      <img src="boudoir photography/24.jpg" alt="photo24" class="cursor-pointer album-img rounded shadow-md object-cover w-full h-full">
   </div>
</main>

<!-- Модальное окно -->
<div id="modal" class="fixed inset-0 hidden items-center justify-center z-50 modal-overlay overflow-hidden bg-black bg-opacity-90">
   <button id="closeBtn" class="absolute top-4 right-6 text-white text-4xl font-bold z-50">&times;</button>
   <button id="prevBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white text-5xl z-50 p-2 hover:text-blue-400 transition">❮</button>
   <button id="nextBtn" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white text-5xl z-50 p-2 hover:text-blue-400 transition">❯</button>

   <div class="flex items-center justify-center w-full h-full p-4">
      <img id="modalImg" src="" alt="full-view" class="max-w-full max-h-full object-contain">
   </div>
</div>
</body>
</html>
